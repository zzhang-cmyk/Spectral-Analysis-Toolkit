
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spectral-toolkit"
version = "0.1.0"
description = "Spectral Analysis Toolkit"
requires-python = ">=3.10"

dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
    "openpyxl>=3.1"
]

[tool.setuptools]
packages = ["spectral_toolkit"]
